<title>__TOUR_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: slim sticky progress bar; reading-order rail on the left, the tour on the right
   (one column under 960px). Groups are numbered because the number is the reading order.
   Margin notes on tricky lines read like a reviewer's highlighter on a printout. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --sunken: #eef1f6;
  --fg: #19202c;
  --muted: #5a6476;
  --line: #dde2ea;
  --accent: #2c4bd1;
  --accent-soft: #e4e9fc;
  --marker: #ffe27a;
  --marker-soft: #fff6cc;
  --marker-ink: #5b4500;
  --add-bg: #e7f6ec;
  --add-num: #cdeed7;
  --add-ink: #1a7f37;
  --del-bg: #fdeceb;
  --del-num: #f9d3d0;
  --del-ink: #c0322b;
  --hunk-bg: #eaf0fb;
  --seen: #1a7f37;
  --side: #8a4fc4;
  --side-soft: #f1e8fb;
  --chore: #6b7280;
  --chore-soft: #eceef2;
  --tok-kw: #a3218a;
  --tok-str: #0a6b4f;
  --tok-num: #0b5cad;
  --tok-com: #7b8494;
  --tok-fn: #5a3fc0;
  --tok-type: #9a5a00;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bar-h: 52px;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141a; --surface: #171b23; --sunken: #1d222c; --fg: #e3e7ee; --muted: #97a0b1;
    --line: #2a303c; --accent: #8fa5ff; --accent-soft: #232c4d; --marker: #d9b42c;
    --marker-soft: #3a3214; --marker-ink: #f6e39a; --add-bg: #13291c; --add-num: #183823;
    --add-ink: #5fd383; --del-bg: #2f1719; --del-num: #431d20; --del-ink: #ff8a80;
    --hunk-bg: #1b2236; --seen: #5fd383; --side: #c49af0; --side-soft: #2c2140;
    --chore: #a3abb8; --chore-soft: #252a33; --tok-kw: #f08bd9; --tok-str: #7fd6b0;
    --tok-num: #8cc4ff; --tok-com: #737d8f; --tok-fn: #b6a4ff; --tok-type: #f0b766;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141a; --surface: #171b23; --sunken: #1d222c; --fg: #e3e7ee; --muted: #97a0b1;
  --line: #2a303c; --accent: #8fa5ff; --accent-soft: #232c4d; --marker: #d9b42c;
  --marker-soft: #3a3214; --marker-ink: #f6e39a; --add-bg: #13291c; --add-num: #183823;
  --add-ink: #5fd383; --del-bg: #2f1719; --del-num: #431d20; --del-ink: #ff8a80;
  --hunk-bg: #1b2236; --seen: #5fd383; --side: #c49af0; --side-soft: #2c2140;
  --chore: #a3abb8; --chore-soft: #252a33; --tok-kw: #f08bd9; --tok-str: #7fd6b0;
  --tok-num: #8cc4ff; --tok-com: #737d8f; --tok-fn: #b6a4ff; --tok-type: #f0b766;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: .86em; background: var(--sunken); padding: .1em .35em; border-radius: 4px; }

/* ---------- progress bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.bar-inner {
  max-width: 1440px; margin: 0 auto; min-height: var(--bar-h);
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 8px;
}
.bar-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 160px; }
.meter { flex: 2 1 220px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.meter-track { flex: 1; height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.meter-fill { height: 100%; width: 0; background: var(--seen); transition: width .25s ease; }
.meter-label { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px;
  padding: 4px 10px; font-size: 13px; cursor: pointer;
}
.tool:hover { border-color: var(--muted); }
.tool[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* ---------- page grid ---------- */
.page { max-width: 1440px; margin: 0 auto; padding-block: 28px 80px; display: grid; gap: 32px; }
@media (min-width: 960px) {
  .page { grid-template-columns: 280px minmax(0, 1fr); }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h) + 20px); max-height: calc(100vh - var(--bar-h) - 40px); overflow-y: auto; }
}

/* ---------- reading-order rail ---------- */
.rail { font-size: 13px; min-width: 0; }
.rail h2 { font: 600 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.rail-group > a { display: flex; gap: 8px; align-items: baseline; text-decoration: none; color: var(--fg); font-weight: 600; }
.rail-num { font-family: var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.4em; }
.rail-group.done > a .rail-num { color: var(--seen); }
.rail-files { list-style: none; margin: 6px 0 0; padding: 0 0 0 calc(1.4em + 8px); display: grid; gap: 2px; }
.rail-files a {
  display: flex; gap: 7px; align-items: center; color: var(--muted); text-decoration: none;
  padding: 2px 6px; margin-left: -6px; border-radius: 5px; min-width: 0;
}
.rail-files a:hover { background: var(--sunken); color: var(--fg); }
.rail-files a.current { background: var(--accent-soft); color: var(--fg); }
.rail-files span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; min-width: 0; }
.dot { flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
.seen-file .dot { background: var(--seen); border-color: var(--seen); }
.seen-file .name { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
.sync { margin-top: 18px; color: var(--muted); font-size: 12px; }

/* ---------- intro ---------- */
.intro { display: grid; gap: 14px; margin-bottom: 40px; max-width: 72ch; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.eyebrow b { color: var(--fg); font-weight: 600; letter-spacing: 0; text-transform: none; font-family: var(--font-mono); font-size: 12.5px; }
h1 { font: 700 clamp(28px, 4vw, 40px)/1.1 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.prose p { margin: 0 0 .7em; }
.prose p:last-child { margin-bottom: 0; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats strong { color: var(--fg); font-weight: 600; }
.plus { color: var(--add-ink); font-weight: 600; }
.minus { color: var(--del-ink); font-weight: 600; }
.pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--marker-soft); color: var(--marker-ink); }
details.commits summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.commits ol { margin: 8px 0 0; padding-left: 0; list-style: none; font-size: 13px; display: grid; gap: 3px; }
details.commits code { margin-right: 8px; }

/* ---------- groups ---------- */
.group { margin-bottom: 56px; scroll-margin-top: calc(var(--bar-h) + 24px); }
.group-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; margin-bottom: 18px; max-width: 80ch; }
.group-num { font: 700 44px/1 var(--font-display); color: var(--line); grid-row: span 3; font-variant-numeric: tabular-nums; min-width: 1.2ch; }
.group.done .group-num { color: var(--seen); }
.group-title { font: 700 22px/1.25 var(--font-display); margin: 0; text-wrap: balance; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.role { font: 600 11px/1 var(--font-body); letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; }
.role-main { background: var(--accent-soft); color: var(--accent); }
.role-side { background: var(--side-soft); color: var(--side); }
.role-chore { background: var(--chore-soft); color: var(--chore); }
.group-meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.group-desc { color: var(--fg); }

/* ---------- file cards ---------- */
.file { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 14px; scroll-margin-top: calc(var(--bar-h) + 16px); }
.file-head {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); z-index: 2;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  border-radius: var(--radius) var(--radius) 0 0;
}
.file.closed .file-head { border-bottom-color: transparent; border-radius: var(--radius); }
.toggle { border: 0; background: none; cursor: pointer; padding: 2px 4px; color: var(--muted); display: flex; }
.toggle svg { transition: transform .15s ease; }
.file.closed .toggle svg { transform: rotate(-90deg); }
.status { font: 600 11px/1 var(--font-mono); width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; flex: none; }
.status-A { background: var(--add-num); color: var(--add-ink); }
.status-D { background: var(--del-num); color: var(--del-ink); }
.status-M, .status-T { background: var(--sunken); color: var(--muted); }
.status-R, .status-C { background: var(--accent-soft); color: var(--accent); }
.path { font: 13px/1.4 var(--font-mono); min-width: 0; flex: 1 1 240px; overflow-wrap: anywhere; }
.path .dir { color: var(--muted); }
.path .base { font-weight: 600; }
.path .from { color: var(--muted); }
.copy {
  border: 1px solid transparent; background: none; border-radius: 6px; padding: 3px 5px;
  color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; margin-left: -6px;
}
.copy:hover { border-color: var(--line); color: var(--fg); }
.diff td.num[data-line] { cursor: copy; }
.diff td.num[data-line]:hover { color: var(--accent); opacity: 1; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); font: 13px var(--font-mono);
  padding: 7px 14px; border-radius: 8px; max-width: calc(100vw - 32px); overflow-wrap: anywhere;
}
.counts { font: 12px var(--font-mono); font-variant-numeric: tabular-nums; display: flex; gap: 8px; }
.seen-btn {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px;
  border: 1px solid var(--line); border-radius: 7px; padding: 3px 10px 3px 8px; background: var(--surface);
}
.seen-btn:hover { border-color: var(--muted); }
.seen-btn .box { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--muted); display: grid; place-items: center; }
.seen-btn .box svg { opacity: 0; }
.file.seen .seen-btn { background: var(--add-bg); border-color: var(--seen); color: var(--seen); }
.file.seen .seen-btn .box { background: var(--seen); border-color: var(--seen); }
.file.seen .seen-btn .box svg { opacity: 1; }
.file-note { flex-basis: 100%; font-size: 13.5px; color: var(--muted); padding-left: 34px; }
.file-body { overflow-x: auto; border-radius: 0 0 var(--radius) var(--radius); }
.file.closed .file-body { display: none; }
.empty { padding: 14px 16px; color: var(--muted); font-size: 13.5px; }
.truncated { padding: 10px 16px; color: var(--muted); font-size: 13px; border-top: 1px dashed var(--line); }
body.hide-seen .file.seen, body.hide-seen .group.done { display: none; }

/* ---------- diff ---------- */
table.diff { border-collapse: collapse; width: 100%; font: 12.5px/1.55 var(--font-mono); }
.diff td { padding: 0 10px; vertical-align: top; }
.diff td.num { width: 1%; min-width: 46px; text-align: right; color: var(--muted); user-select: none; font-variant-numeric: tabular-nums; padding: 0 8px; opacity: .8; }
.diff td.code { white-space: pre; padding-left: 22px; position: relative; }
.diff td.code::before { position: absolute; left: 8px; color: var(--muted); }
.diff tr.add td.code { background: var(--add-bg); }
.diff tr.add td.code::before { content: "+"; color: var(--add-ink); }
.diff tr.add td.num { background: var(--add-num); }
.diff tr.del td.code { background: var(--del-bg); }
.diff tr.del td.code::before { content: "-"; color: var(--del-ink); }
.diff tr.del td.num { background: var(--del-num); }
.diff tr.hunk td { background: var(--hunk-bg); color: var(--muted); padding-block: 4px; }
.diff tr.expander td { background: var(--hunk-bg); color: var(--muted); }
.diff tr.expander td.code { padding-block: 4px; }
.diff tr.expander td.num { padding: 0; text-align: left; opacity: 1; }
.expanders { display: flex; height: 100%; }
.expand {
  border: 0; background: none; color: var(--accent); cursor: pointer;
  padding: 4px 8px; display: inline-flex; align-items: center;
}
.expand:hover { background: var(--accent-soft); }
.diff tr.focus td.num { background: var(--marker); color: var(--marker-ink); opacity: 1; }
.diff tr.note td { padding: 0; white-space: normal; }
.margin-note {
  font: 14px/1.55 var(--font-body); background: var(--marker-soft); color: var(--fg);
  border-left: 4px solid var(--marker); padding: 10px 16px; max-width: 100%;
}
.margin-note .label { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--marker-ink); margin-bottom: 2px; }
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-selector-tag, .hljs-meta .hljs-keyword { color: var(--tok-kw); }
.hljs-string, .hljs-regexp, .hljs-template-tag, .hljs-attr + .hljs-string, .hljs-addition { color: var(--tok-str); }
.hljs-number, .hljs-symbol, .hljs-variable.constant_ { color: var(--tok-num); }
.hljs-comment, .hljs-quote, .hljs-meta { color: var(--tok-com); font-style: italic; }
.hljs-title, .hljs-title.function_, .hljs-section { color: var(--tok-fn); }
.hljs-type, .hljs-title.class_, .hljs-attr, .hljs-attribute, .hljs-property, .hljs-name, .hljs-selector-class { color: var(--tok-type); }

.done-banner { display: none; border: 1px solid var(--seen); background: var(--add-bg); color: var(--seen); border-radius: var(--radius); padding: 14px 18px; font-weight: 600; margin-bottom: 40px; }
body.all-seen .done-banner { display: block; }
.keys { margin-top: 18px; color: var(--muted); font-size: 12px; display: grid; gap: 3px; }
.keys kbd { font: 11px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>

<header class="bar">
  <div class="bar-inner">
    <div class="bar-title" id="bar-title"></div>
    <div class="meter" aria-live="polite">
      <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
      <span class="meter-label" id="meter-label"></span>
    </div>
    <div class="tools">
      <button class="tool" id="hide-seen" aria-pressed="false" type="button">Hide seen</button>
      <button class="tool" id="hide-ws" aria-pressed="false" type="button" title="Compare ignoring whitespace, like git diff -w">Hide whitespace</button>
      <button class="tool" id="expand-all" type="button">Expand all</button>
      <button class="tool" id="collapse-all" type="button">Collapse all</button>
    </div>
  </div>
</header>

<div class="page">
  <nav class="rail" aria-label="Reading order">
    <h2>Reading order</h2>
    <ol id="rail"></ol>
    <div class="sync" id="sync">Seen marks are kept in this browser.</div>
    <div class="keys">
      <span><kbd>j</kbd> <kbd>k</kbd> next / previous file</span>
      <span><kbd>s</kbd> mark current file as seen</span>
      <span><kbd>o</kbd> open or close current file</span>
      <span><kbd>c</kbd> copy current file path</span>
      <span>Click a line number to copy <code>path:line</code></span>
      <span>Click the arrows between hunks to show unchanged lines</span>
    </div>
  </nav>
  <main id="main" style="min-width:0">
    <section class="intro" id="intro"></section>
    <div class="done-banner" id="done-banner"></div>
    <div id="groups"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script id="tour-data" type="application/json">__TOUR_DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  const T = JSON.parse(document.getElementById("tour-data").textContent);
  const files = T.groups.flatMap((g) => g.files);
  const STORE_KEY = "branch-tour:" + T.repo + ":" + T.branch;
  const ROLE_LABEL = { main: "Core change", side: "Side change", chore: "Chore" };
  const STATUS_LABEL = { A: "Added", M: "Modified", D: "Deleted", R: "Renamed", C: "Copied", T: "Type changed" };
  const CHECK = '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6 9.6 3.6" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const COPY = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
  const CHEVRON = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ARROW = {
    down: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    up: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    all: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 5.5l3-3 3 3M5 10.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };
  const EXPAND_STEP = 20;
  const WS_KEY = "branch-tour:hide-whitespace";
  let hideWs = false;
  try { hideWs = localStorage.getItem(WS_KEY) === "1"; } catch (e) {}

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const prose = (s) => s.split(/\n\s*\n/).map((p) => "<p>" + inline(p.trim()) + "</p>").join("");
  const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

  // ---------- copy to clipboard, falling back to a selection the viewer copies by hand ----------
  let toastTimer;
  function toast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
  }
  function copy(text) {
    const done = () => toast("Copied " + text);
    const fallback = () => {
      const t = document.getElementById("toast");
      toast(text);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
      const range = document.createRange();
      range.selectNodeContents(t);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  // ---------- seen state: db when the viewer can use it, browser storage otherwise ----------
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { seen = {}; }
  let db = null;
  const saveLocal = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(seen)); } catch (e) {} };

  function setSeen(file, value, fromStore) {
    if (!!seen[file.key] === value) return;
    if (value) seen[file.key] = true; else delete seen[file.key];
    saveLocal();
    paintFile(file);
    paintProgress();
    if (db && !fromStore) {
      const ref = db.collection("seen").doc(file.key);
      (value ? ref.set({ path: file.path, at: new Date().toISOString() }) : ref.delete())
        .catch(() => { document.getElementById("sync").textContent = "Could not save to the tour. Seen marks are kept in this browser."; });
    }
  }

  // ---------- intro ----------
  function renderIntro() {
    const adds = files.reduce((n, f) => n + f.additions, 0);
    const dels = files.reduce((n, f) => n + f.deletions, 0);
    document.getElementById("bar-title").textContent = T.title;
    const commits = T.commits.length
      ? '<details class="commits"><summary>' + plural(T.commits.length, "commit") + '</summary><ol>' +
        T.commits.map((c) => "<li><code>" + esc(c.sha) + "</code>" + esc(c.subject) + "</li>").join("") + "</ol></details>"
      : "";
    document.getElementById("intro").innerHTML =
      '<div class="eyebrow"><span>' + esc(T.repo) + '</span><b>' + esc(T.branch) + '</b><span>into</span><b>' + esc(T.base) + "</b>" +
      (T.uncommitted ? '<span class="pill">Includes uncommitted changes</span>' : "") + "</div>" +
      "<h1>" + esc(T.title) + "</h1>" +
      '<div class="prose">' + prose(T.summary) + "</div>" +
      '<div class="stats"><span><strong>' + files.length + "</strong> files</span>" +
      "<span><strong>" + T.groups.length + "</strong> steps</span>" +
      '<span class="plus">+' + adds + '</span><span class="minus">−' + dels + "</span>" +
      "<span>at <code>" + esc(T.head) + "</code></span></div>" + commits;
  }

  // ---------- rail ----------
  function renderRail() {
    const rail = document.getElementById("rail");
    T.groups.forEach((g, gi) => {
      const li = el('<li class="rail-group"><a href="#g' + (gi + 1) + '"><span class="rail-num">' + (gi + 1) + "</span><span>" + esc(g.title) + '</span></a><ul class="rail-files"></ul></li>');
      g.files.forEach((f) => {
        const name = f.path.split("/").pop();
        const a = el('<li><a href="#' + f.key + '" title="' + esc(f.path) + '"><span class="dot"></span><span class="name">' + esc(name) + "</span></a></li>");
        f._rail = a.firstElementChild;
        li.querySelector("ul").appendChild(a);
      });
      g._rail = li;
      rail.appendChild(li);
    });
  }

  // ---------- groups and files ----------
  function renderGroups() {
    const root = document.getElementById("groups");
    T.groups.forEach((g, gi) => {
      const sec = el('<section class="group" id="g' + (gi + 1) + '"><div class="group-head">' +
        '<div class="group-num">' + (gi + 1) + "</div>" +
        '<h2 class="group-title">' + esc(g.title) + '<span class="role role-' + g.role + '">' + ROLE_LABEL[g.role] + "</span></h2>" +
        '<div class="group-meta"></div>' +
        '<div class="group-desc prose">' + prose(g.description) + "</div></div></section>");
      g._el = sec;
      g.files.forEach((f) => sec.appendChild(renderFile(f)));
      root.appendChild(sec);
    });
  }

  function renderFile(f) {
    const parts = f.path.split("/");
    const base = parts.pop();
    const dir = parts.length ? parts.join("/") + "/" : "";
    const from = f.oldPath ? '<span class="from">' + esc(f.oldPath) + " → </span>" : "";
    const card = el('<article class="file" id="' + f.key + '">' +
      '<div class="file-head">' +
      '<button class="toggle" type="button" aria-label="Open or close ' + esc(f.path) + '">' + CHEVRON + "</button>" +
      '<span class="status status-' + f.status + '" title="' + (STATUS_LABEL[f.status] || f.status) + '">' + f.status + "</span>" +
      '<span class="path">' + from + '<span class="dir">' + esc(dir) + '</span><span class="base">' + esc(base) + "</span></span>" +
      '<button class="copy" type="button" title="Copy path" aria-label="Copy path ' + esc(f.path) + '">' + COPY + "</button>" +
      '<span class="counts"><span class="plus">+' + f.additions + '</span><span class="minus">−' + f.deletions + "</span></span>" +
      '<button class="seen-btn" type="button" aria-pressed="false"><span class="box">' + CHECK + "</span>Seen</button>" +
      (f.note ? '<div class="file-note">' + inline(f.note) + "</div>" : "") +
      '</div><div class="file-body"></div></article>');
    f._el = card;
    f._revealed = new Set();
    f._open = !f.collapsed && !seen[f.key];
    card.querySelector(".toggle").addEventListener("click", () => setOpen(f, !f._open));
    card.querySelector(".seen-btn").addEventListener("click", () => markAndAdvance(f, !seen[f.key]));
    card.querySelector(".copy").addEventListener("click", () => copy(f.path));
    card.querySelector(".file-body").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-from]");
      if (btn) {
        for (let n = +btn.dataset.from; n <= +btn.dataset.to; n++) f._revealed.add(n);
        f._rendered = false;
        renderDiff(f);
        return;
      }
      const cell = e.target.closest("td.num[data-line]");
      if (cell) copy(f.path + ":" + cell.dataset.line);
    });
    return card;
  }

  function renderDiff(f) {
    const body = f._el.querySelector(".file-body");
    if (f._rendered) return;
    f._rendered = true;
    if (f.binary) { body.innerHTML = '<div class="empty">Binary file, no text diff.</div>'; return; }
    if (!f.hunks.length) {
      body.innerHTML = '<div class="empty">' + (f.oldPath ? "Renamed with no content change." : "No content change (mode or metadata only).") + "</div>";
      return;
    }
    const hunks = hideWs && f.hunksW ? f.hunksW : f.hunks;
    if (!hunks.length) { body.innerHTML = '<div class="empty">Only whitespace changed in this file.</div>'; return; }
    const lang = window.hljs && f.lang && hljs.getLanguage(f.lang) ? f.lang : null;
    const paint = (text) => lang ? hljs.highlight(text, { language: lang, ignoreIllegals: true }).value : esc(text);
    const items = diffItems(f, hunks);
    const lines = items.filter((it) => it.line).map((it) => it.line);
    const inFocus = (o, n) => f.focus.some((x) => {
      const v = x.side === "old" ? o : n;
      return v != null && v >= x.start && v <= (x.end ?? x.start);
    });
    // Each note sits above the first shown line of its range, or at the top when none is shown.
    const notesAt = new Map();
    f.focus.forEach((x) => {
      const col = x.side === "old" ? 1 : 2;
      const hit = lines.find((l) => l[col] != null && l[col] >= x.start && l[col] <= (x.end ?? x.start)) || null;
      (notesAt.get(hit) || notesAt.set(hit, []).get(hit)).push(x);
    });
    const note = (x) => {
      const range = x.start === (x.end ?? x.start) ? "line " + x.start : "lines " + x.start + "–" + x.end;
      return '<tr class="note"><td colspan="3"><div class="margin-note"><span class="label">Look here · ' + (x.side === "old" ? "old " : "") + range + "</span>" + inline(x.note) + "</div></td></tr>";
    };
    const num = (n) => n == null ? '<td class="num"></td>' : '<td class="num" data-line="' + n + '" title="Copy ' + esc(f.path) + ":" + n + '">' + n + "</td>";
    const header = (h) => "@@ −" + h.oldStart + " +" + h.newStart + " @@ " + esc(h.context);
    const rows = (notesAt.get(null) || []).map(note);
    items.forEach((it) => {
      if (it.hunk) {
        rows.push('<tr class="hunk"><td class="num"></td><td class="num"></td><td class="code">' + header(it.hunk) + "</td></tr>");
      } else if (it.gap) {
        rows.push('<tr class="expander"><td class="num" colspan="2"><div class="expanders">' + expanders(it, f.lines.length) + "</div></td>" +
          '<td class="code">' + (it.before ? header(it.before) : plural(it.to - it.from + 1, "unchanged line")) + "</td></tr>");
      } else {
        const l = it.line;
        (notesAt.get(l) || []).forEach((x) => rows.push(note(x)));
        rows.push('<tr class="' + l[0] + (inFocus(l[1], l[2]) ? " focus" : "") + '">' + num(l[1]) + num(l[2]) + '<td class="code">' + paint(l[3]) + "</td></tr>");
      }
    });
    body.innerHTML = '<table class="diff"><tbody>' + rows.join("") + "</tbody></table>" +
      (f.truncated ? '<div class="truncated">Diff cut short here. Run <code>git diff ' + esc(T.mergeBase) + " -- " + esc(f.path) + "</code> for the rest.</div>" : "");
  }

  // The diff as a list of rows: hunk headers, lines, and gaps of unchanged lines still hidden.
  // With the whole new file at hand, the lines between hunks become gaps the viewer can open.
  function diffItems(f, hunks) {
    if (!f.lines) return hunks.flatMap((h) => [{ hunk: h }, ...h.lines.map((l) => ({ line: l }))]);
    const out = [];
    let next = 1, delta = 0;
    const gap = (from, to, before) => {
      let run = null;
      for (let n = from; n <= to; n++) {
        if (f._revealed.has(n)) { run = null; out.push({ line: ["ctx", n + delta, n, f.lines[n - 1]] }); }
        else if (run) run.to = n;
        else { run = { gap: true, from: n, to: n }; out.push(run); }
      }
      if (run && run.to === to) run.before = before;
    };
    hunks.forEach((h) => {
      // Last unchanged line before the hunk, on each side. A zero-length side counts from its start line.
      const oldBefore = h.oldLines ? h.oldStart - 1 : h.oldStart;
      const newBefore = h.newLines ? h.newStart - 1 : h.newStart;
      delta = oldBefore - newBefore;
      gap(next, newBefore, h);
      h.lines.forEach((l) => out.push({ line: l }));
      next = newBefore + h.newLines + 1;
      delta += h.oldLines - h.newLines;
    });
    gap(next, f.lines.length, null);
    return out;
  }

  function expanders(run, total) {
    const btn = (dir, from, to, label) =>
      '<button class="expand" type="button" data-from="' + from + '" data-to="' + to + '" title="' + label + '" aria-label="' + label + '">' + ARROW[dir] + "</button>";
    const size = run.to - run.from + 1;
    if (size <= EXPAND_STEP) return btn("all", run.from, run.to, "Show " + plural(size, "hidden line"));
    return (run.from > 1 ? btn("down", run.from, run.from + EXPAND_STEP - 1, "Show " + EXPAND_STEP + " more lines below") : "") +
      (run.to < total ? btn("up", run.to - EXPAND_STEP + 1, run.to, "Show " + EXPAND_STEP + " more lines above") : "") +
      btn("all", run.from, run.to, "Show all " + size + " hidden lines");
  }

  function setOpen(f, open) {
    f._open = open;
    if (open) renderDiff(f);
    f._el.classList.toggle("closed", !open);
  }

  // ---------- painting ----------
  function paintFile(f) {
    const on = !!seen[f.key];
    f._el.classList.toggle("seen", on);
    f._el.querySelector(".seen-btn").setAttribute("aria-pressed", String(on));
    f._rail.parentElement.classList.toggle("seen-file", on);
  }

  function paintProgress() {
    const done = files.filter((f) => seen[f.key]).length;
    document.getElementById("meter-fill").style.width = (files.length ? (100 * done) / files.length : 0) + "%";
    document.getElementById("meter-label").textContent = done + " of " + files.length + " files seen";
    T.groups.forEach((g) => {
      const n = g.files.filter((f) => seen[f.key]).length;
      const complete = n === g.files.length;
      g._el.classList.toggle("done", complete);
      g._rail.classList.toggle("done", complete);
      g._el.querySelector(".group-meta").textContent = n + " of " + plural(g.files.length, "file") + " seen";
    });
    document.body.classList.toggle("all-seen", done === files.length && files.length > 0);
    document.getElementById("done-banner").textContent = "All " + files.length + " files seen. That is the whole branch.";
  }

  // ---------- navigation ----------
  let current = files[0];
  function setCurrent(f) {
    if (current && current._rail) current._rail.classList.remove("current");
    current = f;
    if (f && f._rail) f._rail.classList.add("current");
  }
  function visibleFiles() { return files.filter((f) => f._el.offsetParent !== null); }
  function goTo(f) {
    if (!f) return;
    setCurrent(f);
    f._el.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  function markAndAdvance(f, value) {
    setCurrent(f);
    setSeen(f, value);
    if (value) {
      setOpen(f, false);
      const top = f._el.getBoundingClientRect().top;
      if (top < 0) f._el.scrollIntoView({ block: "start" });
    }
  }

  const observer = new IntersectionObserver((entries) => {
    const hit = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (hit) setCurrent(files.find((f) => f._el === hit.target));
  }, { rootMargin: "-60px 0px -70% 0px" });

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
    const list = visibleFiles();
    const i = list.indexOf(current);
    if (e.key === "j") goTo(list[Math.min(i + 1, list.length - 1)] || list[0]);
    else if (e.key === "k") goTo(list[Math.max(i - 1, 0)]);
    else if (e.key === "s" && current) markAndAdvance(current, !seen[current.key]);
    else if (e.key === "o" && current) setOpen(current, !current._open);
    else if (e.key === "c" && current) copy(current.path);
    else return;
    e.preventDefault();
  });

  document.getElementById("hide-seen").addEventListener("click", (e) => {
    const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(on));
    document.body.classList.toggle("hide-seen", on);
  });
  const wsBtn = document.getElementById("hide-ws");
  wsBtn.setAttribute("aria-pressed", String(hideWs));
  wsBtn.addEventListener("click", () => {
    hideWs = !hideWs;
    wsBtn.setAttribute("aria-pressed", String(hideWs));
    try { localStorage.setItem(WS_KEY, hideWs ? "1" : "0"); } catch (e) {}
    files.forEach((f) => { f._rendered = false; if (f._open) renderDiff(f); });
  });
  document.getElementById("expand-all").addEventListener("click", () => files.forEach((f) => setOpen(f, true)));
  document.getElementById("collapse-all").addEventListener("click", () => files.forEach((f) => setOpen(f, false)));

  // ---------- boot ----------
  renderIntro();
  renderRail();
  renderGroups();
  files.forEach((f) => { setOpen(f, f._open); paintFile(f); observer.observe(f._el); });
  paintProgress();
  setCurrent(files[0]);
  if (location.hash) { const f = files.find((x) => "#" + x.key === location.hash); if (f) { setOpen(f, true); goTo(f); } }

  if (window.claude && window.claude.use) {
    window.claude.use("db").then((store) => {
      if (!store) return;
      db = store;
      document.getElementById("sync").textContent = "Seen marks are saved with this tour.";
      const byKey = new Map(files.map((f) => [f.key, f]));
      let synced = false;
      db.collection("seen").onSnapshot((snap) => {
        const keys = new Set(snap.docs.map((d) => d.id));
        // Marks made in this browser before the store answered are pushed up once.
        if (!synced) {
          synced = true;
          files.forEach((f) => { if (seen[f.key] && !keys.has(f.key)) db.collection("seen").doc(f.key).set({ path: f.path, at: new Date().toISOString() }).catch(() => {}); keys.add(f.key); });
        }
        byKey.forEach((f, key) => setSeen(f, keys.has(key), true));
      }, () => { document.getElementById("sync").textContent = "Seen marks are kept in this browser."; });
    });
  }
})();
</script>
